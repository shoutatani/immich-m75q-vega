# Immich v3.3.1の公式構成を基に、推論コンテナだけVega 11に対応。
services:
  immich-server:
    image: ghcr.io/immich-app/immich-server:v3.3.1
    volumes:
      - ${UPLOAD_LOCATION}:/data
      - /etc/localtime:/etc/localtime:ro
    env_file: .env
    ports:
      - '${IMMICH_HTTP_PORT:-2283}:2283'
    depends_on:
      - redis
      - database
    restart: always
    healthcheck:
      disable: false
  immich-machine-learning:
    image: ${IMMICH_ML_IMAGE:?セットアップを実行してください}
    pull_policy: never
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    group_add:
      - '${IMMICH_VIDEO_GID}'
      - '${IMMICH_RENDER_GID}'
    environment:
      HSA_OVERRIDE_GFX_VERSION: '9.0.0'
      HSA_USE_SVM: '0'
      HSA_ENABLE_SDMA: '0'
      MACHINE_LEARNING_MODEL_TTL: '3600'
      MACHINE_LEARNING_WORKERS: '1'
      MACHINE_LEARNING_REQUEST_THREADS: '1'
      MACHINE_LEARNING_MODEL_REVISION: 'main'
      MACHINE_LEARNING_MAX_BATCH_SIZE__OCR: '1'
      MACHINE_LEARNING_MAX_BATCH_SIZE__FACIAL_RECOGNITION: '1'
    volumes:
      - model-cache:/cache
    restart: always
    healthcheck:
      disable: false
  redis:
    image: docker.io/valkey/valkey:9@sha256:c123e3715db63d06d4ad6964884037aa0d5d4d703939b9929954112889708e1d
    healthcheck:
      test: redis-cli ping | grep -q PONG || exit 1
    restart: always
  database:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: '--data-checksums'
    volumes:
      - ${DB_DATA_LOCATION}:/var/lib/postgresql/data
    shm_size: 128mb
    restart: always
    healthcheck:
      disable: false
volumes:
  model-cache:
